  <body>
    <div id="root">
      <div id="file-protocol-warning" style="display: none; min-height: 100vh; background: #050711; color: #e2e8f0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center;">
        <div style="max-width: 600px; background: rgba(13, 19, 38, 0.9); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px; padding: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
          <div style="font-size: 40px; margin-bottom: 16px;">🚀</div>
          <h2 style="font-size: 24px; color: #38bdf8; margin: 0 0 12px 0;">Rajhans Mahato Portfolio</h2>
          <p style="font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px;">
            Aapne file explorer se direct <code>index.html</code> open kiya hai. React + Vite web apps ko browser me dekhne ke liye local dev server open karein:
          </p>
          <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
            <a href="http://127.0.0.1:5173/" target="_blank" style="display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #06b6d4, #3b82f6); color: white; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 15px; box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);">
              🌐 Open Live Portfolio: http://localhost:5173
            </a>
            <span style="font-size: 12px; color: #64748b;">(Vite dev server is currently running)</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('file-protocol-warning').style.display = 'flex';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
